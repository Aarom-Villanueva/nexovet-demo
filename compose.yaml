name: nexovet
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexovet
      POSTGRES_PASSWORD: nexovet_local_only
      POSTGRES_DB: nexovet_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexovet -d nexovet_dev']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
