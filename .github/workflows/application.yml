name: Aplicación NexoVet
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexovet
          POSTGRES_PASSWORD: nexovet_ci_only
          POSTGRES_DB: nexovet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexovet -d nexovet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      ENABLE_DEMO: 'true'
      DATABASE_URL: postgresql://nexovet:nexovet_ci_only@127.0.0.1:5432/nexovet_test
      TEST_DATABASE_URL: postgresql://nexovet:nexovet_ci_only@127.0.0.1:5432/nexovet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
